<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 320px;
      max-height: 320px;
      width: 480px;
      max-width: 480px;
      overflow-x: hidden;
      /* The lines below helped with aligning the buttons to the bottom of the display */
      display: flex; /* Activate Flexbox */
      flex-direction: column; /* Stack children vertically */
      justify-content: flex-end; /* Pin children to the bottom */
    }
  </style>
  <!-- <time>Cyber Test</time> -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cybercore.css') }}" type="text/css">
  <!--  NOTE: 
    The downloaded tabler-icons.min.css files points to a fonts file, tabler-icons.woff2, that 
    is located in the fonts directory. This had to be manually updated to point to:
      ../font/tabler-icons.woff2
    Without this change, the icons will not load and will show as blank squares.
  -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tabler-icons.min.css') }}" type="text/css">
</head>
<!-- darker green background color -->
<body>
<nav class="cyber-nav" style="width:100%;">
  <a href="#" class="cyber-nav__brand">VSD</a>
  <ul class="cyber-nav__links">
    <li><a href="#" class="cyber-nav__link cyber-nav__link--active">Home</a></li>
    <li><a href="#" class="cyber-nav__link">Systems</a></li>
    <li><a href="#" class="cyber-nav__link">Network</a></li>
  </ul>
</nav>
<!-- 1fr - fractional grid setting, evenly dividing the columns based on the parent width -->
<!-- box-sizing set to border-box to permit consistent box orientation -->
<div class="control-panel cyber-noise cyber-text-center" style="width:100%;box-sizing:border-box;">
    <div style="padding: 25px;display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 100px); gap: 1px;margin-bottom:0;">
      {% for i in range(8) %}
      <div id="stim-card-{{ i }}" style="width: 100px; height: 100px;" class="cyber-card cyber-card--interactive"> 
        <div class="cyber-card__body cyber-text-center" style="display: flex; flex-direction: column; align-items: center;"> 
          <i class="ti ti-volume cyber-icon--md cyber-icon--cyan"></i>
          <span>{{ i + 1 }}</span>
        </div>
      </div>
      {% endfor %}
    </div>
</div>

</body>

<!-- This script adjusts the tab/window title , instead of the default IP address+PORT -->

  document.title = "Cyber Widget – Online";
</script>

<script src="{{ url_for('static', filename='js/cyber.js') }}"></script>

</html>
