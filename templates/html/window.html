<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" name="viewport" content="width=480, initial-scale=1.0">
  <style>
    body {
      width: 480px;
      max-width: 480px;
      overflow-x: hidden;
    }
  </style>
  <!-- <time>Cyber Test</time> -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cybercore.css') }}" type="text/css">
  <!--  NOTE: 
    The downloaded tabler-icons.min.css files points to a fonts file, tabler-icons.woff2, that 
    is located in the fonts directory. This had to be manually updated to point to:
      ../font/tabler-icons.woff2
    Without this change, the icons will not load and will show as blank squares.
  -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tabler-icons.min.css') }}" type="text/css">
</head>
<!-- darker green background color -->
<body>
<div class="control-panel cyber-noise cyber-text-center" style="margin-top: auto;">
    <div style="padding: 10px;display: grid; grid-template-columns: repeat(4, 100px); grid-template-rows: repeat(2, 100px); gap: 1px;">
      {% for i in range(8) %}
      <div id="stim-card-{{ i }}" style="width: 100px; height: 100px;" class="cyber-card cyber-card--interactive"> 
        <div class="cyber-card__body cyber-text-center" style="display: flex; flex-direction: column; align-items: center;"> 
          <i class="ti ti-volume cyber-icon--md cyber-icon--cyan"></i>
          <span>{{ i + 1 }}</span>
        </div>
      </div>
      {% endfor %}
    </div>
</div>

</body>

</script>

<script src="{{ url_for('static', filename='js/cyber.js') }}"></script>

</html>
